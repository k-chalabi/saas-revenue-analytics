
# Validate the Airflow environment and DAGs before merging into main.
name: Airflow CI

# Run this workflow whenever a Pull Request targets main.
on:
  pull_request:
    branches:
      - main

jobs:
  airflow-ci:

    # GitHub provides a temporary Ubuntu machine to execute the CI checks.
    runs-on: ubuntu-latest

    steps:
      # Download the Pull Request code into the runner's workspace.
      # The following steps can then access our Dockerfile and DAG files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build a temporary Airflow image using our DEV Dockerfile.
      # This verifies that Airflow and dbt can be installed successfully.
      # The image is tagged :ci so it can be reused in the DAG validation step.
      - name: Build Airflow Docker image
        run: docker build -t saas-revenue-airflow:ci -f airflow/Dockerfile .

      # Use Python installed on the GitHub runner (outside Docker)
      # to detect syntax errors in all our DAG Python files.
      # This does not load or execute the DAGs.
      - name: Check DAG Python syntax
        run: python -m compileall -q airflow/dags

      # Start a temporary container using the image built earlier.
      # Mount the repository's DAG files inside it in read-only mode.
      # Then use Airflow's DagBag to import the DAGs and detect errors.
      # This validates DAG loading without executing the pipelines.
      - name: Validate Airflow DAGs
        run: |
          docker run --rm \
            -e BQ_RAW_DATASET=raw_dev \
            -v "${{ github.workspace }}/airflow/dags:/opt/airflow/dags:ro" \
            saas-revenue-airflow:ci \
            python -c "
          from airflow.models.dagbag import DagBag

          dagbag = DagBag(
              dag_folder='/opt/airflow/dags',
              include_examples=False
          )

          if dagbag.import_errors:
              for path, error in dagbag.import_errors.items():
                  print(f'{path}: {error}')
              raise SystemExit(1)

          expected_dags = {
              'gcs_to_bigquery_raw',
              'saas_revenue_pipeline_dev'
          }

          missing_dags = expected_dags - set(dagbag.dags)

          if missing_dags:
              print(f'Missing DAGs: {missing_dags}')
              raise SystemExit(1)

          print('All Airflow DAGs validated successfully.')
          "
