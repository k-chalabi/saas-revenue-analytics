
# Deploy approved Terraform infrastructure changes after merges to main.
name: Terraform CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-cd.yml"

permissions:
  contents: read
  id-token: write

# Prevent concurrent Terraform deployments.
concurrency:
  group: terraform-cd
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Execute Terraform commands from the terraform directory.
    defaults:
      run:
        working-directory: terraform

    steps:
      # Download the repository from GitHub into the runner's workspace.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to GCP using the Terraform CI service account.
      # No service account JSON key is required.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/614303829873/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: terraform-ci@saas-revenue-analytics-507122.iam.gserviceaccount.com

      # Install the same Terraform CLI version used locally.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      # Check Terraform formatting without modifying files.
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Initialize the GCS backend and install locked provider versions.
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # Validate Terraform configuration and resource definitions.
      - name: Terraform Validate
        run: terraform validate

      # Save the infrastructure changes to a Terraform plan file.
      # State locking prevents concurrent Terraform operations.
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Generate a readable version of the saved Terraform plan.
      - name: Terraform Show
        run: terraform show -no-color tfplan > plan.txt

      # Store both plan files for review and deployment.
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan.txt
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    # Require manual approval before deploying infrastructure changes.
    environment: terraform-deploy

    # Execute Terraform commands from the terraform directory.
    defaults:
      run:
        working-directory: terraform

    steps:
      # Download the repository from GitHub into the runner's workspace.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Temporarily check the GitHub OIDC claims used by Terraform CD.
      - name: Diagnose Terraform CD OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            const expected = {
              repository_id: '1372472439',
              repository_owner_id: '226288651',
              workflow_ref: 'k-chalabi/saas-revenue-analytics/.github/workflows/terraform-cd.yml@refs/heads/main',
              sub: 'repo:k-chalabi/saas-revenue-analytics:environment:terraform-deploy'
            };

            for (const [claim, value] of Object.entries(expected)) {
              core.info(`${claim}: ${payload[claim] === value ? 'MATCH' : 'MISMATCH'}`);
            }

      # Authenticate to GCP using Workload Identity Federation.
      # No service account JSON key is required.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/614303829873/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: terraform-cd@saas-revenue-analytics-507122.iam.gserviceaccount.com

      # Install the same Terraform CLI version used locally.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      # Initialize the GCS backend and install locked provider versions.
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      # Download the exact Terraform plan generated by the previous job.
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # Apply exactly the previously reviewed Terraform plan.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan

