name: saas-revenue-airflow-prod

# Shared configuration for PROD Airflow services.
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile.prod
  image: saas-revenue-airflow:prod

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    # dbt PROD configuration.
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_TARGET: prod
    BQ_RAW_DATASET: raw
    DBT_PROFILES_DIR: /opt/airflow/dbt-config

    # Dedicated PROD credentials.
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gcp-dbt-prod-key.json
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: "google-cloud-platform://"
    AIRFLOW_CONN_GOOGLE_CLOUD_INGESTION: 'google-cloud-platform://?key_path=%2Fopt%2Fairflow%2Fsecrets%2Fgcp-ingestion-prod-key.json'

  volumes:
    # PROD runtime logs only; DAGs and dbt are embedded in the image.
    - prod-airflow-logs:/opt/airflow/logs

    # PROD credentials are mounted read-only, never baked into the image.
    - ../secrets/gcp-dbt-prod-key.json:/opt/airflow/secrets/gcp-dbt-prod-key.json:ro
    - ../secrets/gcp-ingestion-prod-key.json:/opt/airflow/secrets/gcp-ingestion-prod-key.json:ro

    # Mount the PROD dbt profile under its expected filename.
    - ./config/dbt/profiles.prod.yml:/opt/airflow/dbt-config/profiles.yml:ro

  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - prod-postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8083:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  prod-postgres-db-volume:
  prod-airflow-logs: